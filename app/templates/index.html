<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>STQuant</title>
  <link rel="stylesheet" href="/static/styles.css">
  <script src="https://cdn.plot.ly/plotly-2.35.2.min.js"></script>
</head>
<body>
  <header>
    <div>
      <h1>STQuant</h1>
      <p>低价股网格策略工作台</p>
    </div>
    <button id="healthBtn">检查连接</button>
  </header>

  <main>
    <section class="panel">
      <h2>股票筛选</h2>
      <div class="grid controls">
        <label>最低价 <input id="minPrice" type="number" step="0.1" value="3.0"></label>
        <label>最高价 <input id="maxPrice" type="number" step="0.1" value="5.5"></label>
        <label>20日成交额下限 <input id="minAmount" type="number" step="1000000" value="30000000"></label>
        <label>3年价格分位上限 <input id="maxPosition" type="number" step="0.05" value="0.45"></label>
        <label>负债率上限 <input id="maxDebt" type="number" step="1" value="75"></label>
        <label>ROE下限 <input id="minRoe" type="number" step="0.5" value="0"></label>
        <label>数量 <input id="limit" type="number" step="10" value="200"></label>
        <label class="check"><input id="positiveProfit" type="checkbox" checked> 净利润为正</label>
        <label class="check"><input id="positiveCash" type="checkbox"> 经营现金流为正</label>
      </div>
      <div class="actions">
        <button id="filterBtn">筛选股票</button>
        <button id="backtestSelectedBtn">回测当前结果</button>
      </div>
      <div id="candidateMeta" class="meta"></div>
      <div class="tableWrap">
        <table id="candidateTable"></table>
      </div>
    </section>

    <section class="panel">
      <h2>网格回测</h2>
      <div class="grid controls">
        <label>初始资金 <input id="initialCash" type="number" value="100000"></label>
        <label>单股底仓比例 <input id="initialPct" type="number" step="0.001" value="0.009"></label>
        <label>单股最大仓位 <input id="maxPct" type="number" step="0.005" value="0.03"></label>
        <label>补仓网格 <input id="gridStep" type="number" step="0.01" value="0.05"></label>
        <label>T出利润 <input id="takeProfit" type="number" step="0.01" value="0.05"></label>
        <label>手续费率 <input id="feeRate" type="number" step="0.0001" value="0.00025"></label>
        <label>滑点 <input id="slippage" type="number" step="0.001" value="0.005"></label>
        <label>最多股票数 <input id="maxCodes" type="number" value="80"></label>
      </div>
      <div class="actions">
        <button id="backtestBtn">运行回测</button>
      </div>
      <div id="summary" class="summary"></div>
      <div id="equityChart" class="chart"></div>
      <div class="tableWrap">
        <table id="stockResultTable"></table>
      </div>
    </section>

    <section class="panel">
      <h2>数据下载</h2>
      <div class="grid controls">
        <label>周期 <select id="period"><option>1m</option><option>5m</option><option>1d</option></select></label>
        <label>开始 <input id="downloadStart" value="20250101"></label>
        <label>结束 <input id="downloadEnd" value="20260507"></label>
        <label>复权 <select id="dividendType"><option value="none">不复权</option><option value="front">前复权</option></select></label>
      </div>
      <div class="actions">
        <button id="downloadBtn">让 Windows qmt_agent 下载当前结果</button>
      </div>
      <pre id="downloadStatus"></pre>
    </section>

    <section class="panel">
      <h2>实盘交易</h2>
      <p class="meta">第一版仅保存配置和预留接口，默认 dry-run。正式下单前需要再加账户、风控、撤单和成交回报确认。</p>
      <div class="grid controls">
        <label class="check"><input id="liveEnabled" type="checkbox"> 启用</label>
        <label class="check"><input id="dryRun" type="checkbox" checked> dry-run</label>
        <label>总仓位上限 <input id="liveTotalPct" type="number" step="0.05" value="0.4"></label>
        <label>单股仓位上限 <input id="liveSinglePct" type="number" step="0.005" value="0.03"></label>
      </div>
      <div class="actions"><button id="saveLiveBtn">保存实盘配置</button></div>
      <pre id="liveStatus"></pre>
    </section>
  </main>

  <script src="/static/app.js"></script>
</body>
</html>
